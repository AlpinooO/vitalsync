services:
 
 
  backend:
    build: ./backend
    container_name: vitalsync-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - vitalsync-network
    depends_on:
      - database
 
  frontend:
    build: ./frontend
    container_name: vitalsync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - vitalsync-network
    depends_on:
      - backend
  database:
    image: postgres:16-alpine
    container_name: vitalsync-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-vitalsync}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
 
networks:
  vitalsync-network:
    driver: bridge
 
volumes:
  postgres-data:
 