services:
 
 
  backend:
    build: ./backend
    container_name: vitalsync-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - vitalsync-network
    depends_on:
      database:
        condition: service_healthy
 
  frontend:
    build: ./frontend
    container_name: vitalsync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - vitalsync-network
    depends_on:
      - backend
  database:
    image: postgres:16-alpine
    container_name: vitalsync-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
 
networks:
  vitalsync-network:
    driver: bridge
 
volumes:
  postgres-data:
 