name: CI/CD VitalSync

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Tests unitaires Jest
        working-directory: backend
        run: npm test

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t vitalsync-backend ./backend

      - name: Build frontend
        run: docker build -t vitalsync-frontend ./frontend

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le fichier .env
        run: |
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=vitalsync" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Démarrer les services docker compose
        run: docker compose up -d --build

      - name: Attendre que le backend soit prêt
        run: sleep 30

      - name: Health check backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check échoué : HTTP $STATUS"
            docker compose logs backend
            exit 1
          fi
          echo "Health check OK : HTTP $STATUS"

      - name: Arrêter les services
        if: always()
        run: docker compose down